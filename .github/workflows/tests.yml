name: Documentation checks

# The repository IS the product here, so the docs are asserted the way code is.
# See ARCHITECTURE 7.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Documentation freshness
        run: python3 tests/test_docs.py

      - name: Content prohibitions
        run: python3 tests/test_prohibitions.py
